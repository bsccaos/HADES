image: python:3.11-slim

pages:
  stage: deploy
  script:
    - pip install --no-cache-dir mkdocs mkdocs-material
    - python scripts/generate_team.py
    - python scripts/generate_ips.py
    - python scripts/generate_software.py
    - mkdocs build --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
