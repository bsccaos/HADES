site_name: HArdware Dependability for Embedded Systems (HADES)
site_description: Research in SoCs, Hardware IPs, and Systems Software
site_author: "HADES Research Group"
site_url: https://pages.bsc.es/hades_webpage/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - toc.integrate
    - search.suggest
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple

nav:
  - Home: index.md
  - Our Team: team.md
  - Publications: publications.md
  - Systems on Chip (SoCs): socs/index.md
  - Hardware IPs: ips/index.md
  - Software & Tools: software/index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
  - pymdownx.arithmatex:
      generic: true
